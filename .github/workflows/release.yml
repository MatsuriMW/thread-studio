name: Release

# Push a tag that matches manifest.json's version (e.g. 1.0.0) to build and
# publish a GitHub Release with the three files Obsidian installs.
on:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Check the tag matches manifest.json
              run: test "$(node -p 'require("./manifest.json").version')" = "${GITHUB_REF_NAME}"

            - run: pnpm run lint
            - run: pnpm run lint:obsidian
            - run: pnpm run test
            - run: pnpm run build

            # Lets anyone verify that the release files were built from this repository.
            - uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      main.js
                      manifest.json
                      styles.css
